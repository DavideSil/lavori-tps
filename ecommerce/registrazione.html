<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduShop - Registrazione Anagrafica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">EduShop 🛒</a>
            <nav>
                <a href="index.html">Prodotti</a>
                <a href="registrazione.html" class="highlight">Registrati</a>
                <a href="carrello.html">Carrello (<span id="num-carrello">0</span>)</a>
            </nav>
        </div>
    </header>

    <div id="notifica" class="hidden" style="position: fixed; bottom: 1rem; right: 1rem; z-index: 1000;">
        <span id="testo-notifica"></span>
    </div>

    <main>
        <div class="form-container">
            <h2 class="form-title">Anagrafica Utente 📝</h2>
            
            <div id="msg" class="error-msg"></div>

            <form onsubmit="event.preventDefault();">
                <div class="form-grid two-cols">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome">
                    </div>
                    <div class="form-group">
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome">
                    </div>
                </div>

                <div class="form-grid two-cols">
                    <div class="form-group">
                        <label for="dataNascita">Data di Nascita</label>
                        <input type="date" id="dataNascita">
                    </div>
                    <div class="form-group">
                        <label>Sesso</label>
                        <div class="radio-group">
                            <label><input type="radio" name="sesso" value="Maschio"> Maschio</label>
                            <label><input type="radio" name="sesso" value="Femmina"> Femmina</label>
                            <label><input type="radio" name="sesso" value="Altro"> Altro</label>
                        </div>
                    </div>
                </div>

                <div class="form-grid two-cols">
                    <div class="form-group">
                        <label for="indirizzo">Indirizzo</label>
                        <input type="text" id="indirizzo">
                    </div>
                    <div class="form-group">
                        <label for="citta">Città</label>
                        <input type="text" id="citta">
                    </div>
                </div>

                <div class="form-grid two-cols">
                    <div class="form-group">
                        <label for="cap">CAP</label>
                        <input type="text" id="cap">
                    </div>
                    <div class="form-group">
                        <label for="provincia">Provincia</label>
                        <select id="provincia">
                            <option value="">Seleziona</option>
                            <option value="Milano">Milano</option>
                            <option value="Varese">Varese</option>
                            <option value="Roma">Roma</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid two-cols">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="text" id="email">
                    </div>
                    <div class="form-group">
                        <label for="codiceFiscale">Codice Fiscale</label>
                        <input type="text" id="codiceFiscale">
                    </div>
                </div>

                <div class="form-grid two-cols" style="border-top: 1px solid #e5e7eb; padding-top: 1rem; margin-top: 1rem;">
                    <div class="form-group">
                        <label>Mezzi di Trasporto</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="mezzo" value="Auto"> Auto</label>
                            <label><input type="checkbox" name="mezzo" value="Moto"> Moto</label>
                            <label><input type="checkbox" name="mezzo" value="Bici"> Bici</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="materia">Materia Preferita</label>
                        <select id="materia">
                            <option value="Matematica">Matematica</option>
                            <option value="TPSIT">TPSIT</option>
                            <option value="Informatica">Informatica</option>
                        </select>
                    </div>
                </div>

                <button type="button" onclick="inserisci()" class="btn-submit">Inserisci e Conferma</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 EduShop - Progetto Ecommerce Didattico.</p>
    </footer>

    <script>
        let carrello = JSON.parse(localStorage.getItem("carrello")) || [];
        document.getElementById('num-carrello').innerText = carrello.reduce((acc, item) => acc + item.quantita, 0);

        function avviso(messaggio) {
            const notifica = document.getElementById('notifica');
            const testo = document.getElementById('testo-notifica');
            testo.innerText = messaggio;
            notifica.classList.remove('hidden');
            setTimeout(() => { notifica.classList.add('hidden'); }, 2000);
        }

        function validaNome() {
            let v = document.getElementById("nome").value;
            const pattern = /^[a-zA-ZàèéìòùÀÈÉÌÒÙ ]+$/;
            if (!pattern.test(v)) {
                document.getElementById("msg").innerHTML = "nome non valido";
                return false;
            }
            return true;
        }

        // --- CONTROLLO COGNOME ---
        function validaCognome() {
            let v = document.getElementById("cognome").value;
            const pattern = /^[a-zA-ZàèéìòùÀÈÉÌÒÙ ]+$/;
            if (!pattern.test(v)) {
                document.getElementById("msg").innerHTML = "cognome non valido";
                return false;
            }
            return true;
        }

        // --- CONTROLLO DATA NASCITA ---
        function validaData() {
            let v = document.getElementById("dataNascita").value;
            if (v == "") {
                document.getElementById("msg").innerHTML = "data non valida";
                return false;
            }
            return true;
        }

        // --- CONTROLLO CAP ---
        function validaCap() {
            let v = document.getElementById("cap").value;
            const pattern = /^\d{5}$/;
            if (!pattern.test(v)) {
                document.getElementById("msg").innerHTML = "cap non valido";
                return false;
            }
            return true;
        }

        // --- CONTROLLO EMAIL ---
        function validaEmail() {
            let v = document.getElementById("email").value;
            const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
            if (!pattern.test(v)) {
                document.getElementById("msg").innerHTML = "email non valido";
                return false;
            }
            return true;
        }

        // --- CONTROLLO CODICE FISCALE ---
        function validaCodiceFiscale() {
            let v = document.getElementById("codiceFiscale").value.toUpperCase();
            const pattern = /^[A-Z]{6}[0-9]{2}[A-Z]{1}[0-9]{2}[A-Z]{1}[0-9]{3}[A-Z]{1}$/;
            if (!pattern.test(v)) {
                document.getElementById("msg").innerHTML = "codice fiscale non valido";
                return false;
            }
            return true;
        }

        function getSesso() {
            let radios = document.getElementsByName("sesso");
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked == true) return radios[i].value;
            }
            return "";
        }

        function getMezzi() {
            let checks = document.getElementsByName("mezzo");
            let selezionati = "";
            for (let i = 0; i < checks.length; i++) {
                if (checks[i].checked == true) selezionati = selezionati + checks[i].value + " ";
            }
            return selezionati.trim();
        }

        function getGenerazione(anno) {
            switch (true) {
                case anno >= 1901 && anno <= 1927: return "Generazione Grandiosa";
                case anno >= 1928 && anno <= 1945: return "Generazione Silenziosa";
                case anno >= 1946 && anno <= 1964: return "Baby Boomers";
                case anno >= 1965 && anno <= 1980: return "Generazione X";
                case anno >= 1981 && anno <= 1996: return "Millennials";
                case anno >= 1997 && anno <= 2012: return "Generazione Z";
                case anno >= 2013:                 return "Generazione Alpha";
                default:                           return "Generazione molto vecchia";
            }
        }

        function inserisci() {
            document.getElementById("msg").innerHTML = "";

            if (!validaNome())          return;
            if (!validaCognome())       return;
            if (!validaData())          return;
            if (!validaCap())           return;
            if (!validaEmail())         return;
            if (!validaCodiceFiscale()) return;

            let data = document.getElementById("dataNascita").value;
            let anno = new Date(data).getFullYear();

            let persona = {};
            persona.nome          = document.getElementById("nome").value;
            persona.cognome       = document.getElementById("cognome").value;
            persona.dataNascita   = data;
            persona.anno          = anno;
            persona.generazione   = getGenerazione(anno);
            persona.sesso         = getSesso();
            persona.indirizzo     = document.getElementById("indirizzo").value;
            persona.citta         = document.getElementById("citta").value;
            persona.cap           = document.getElementById("cap").value;
            persona.provincia     = document.getElementById("provincia").value;
            persona.email         = document.getElementById("email").value;
            persona.codiceFiscale = document.getElementById("codiceFiscale").value.toUpperCase();
            persona.mezzi         = getMezzi();
            persona.materia       = document.getElementById("materia").value;

            let elenco = JSON.parse(localStorage.getItem("elenco"));
            if (elenco == null) elenco = [];
            elenco.push(persona);
            localStorage.setItem("elenco", JSON.stringify(elenco));

            localStorage.setItem("utenteLoggato", JSON.stringify(persona));

            avviso("Registrazione anagrafica completata!");
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        }
    </script>
</body>
</html>
