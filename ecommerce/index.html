<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecommerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">ecommerce</a>
            <nav>
                <a href="index.html" class="highlight">Prodotti</a>
                <a href="registrazione.html">Registrati</a>
                <a href="carrello.html">Carrello (<span id="num-carrello">0</span>)</a>
            </nav>
        </div>
    </header>

    <div id="notifica" class="hidden" style="position: fixed; bottom: 1rem; right: 1rem; z-index: 1000;">
        <span id="testo-notifica"></span>
    </div>

    <main>
        <div class="welcome-box">
            <h2>Benvenuto</h2>
        </div>

        <div id="lista-prodotti" class="grid-prodotti"></div>
    </main>

    <script>
        const prodottiCSV = `nome;marca;descrizione;immagine;prezzo;dimensions;taglio;giorni_di_viaggio;provenienza;categoria
Computer Portatile;TechCorp;PC portatile ad alte prestazioni per studio e lavoro.;https://images.unsplash.com/photo-1496181130204-755241544e35?auto=format&fit=crop&w=400&q=80;599.00;15 pollici;Standard;;UE;Tecnologia
Telefono Smartphone;MobileTech;Smartphone di ultima generazione con schermo ultra nitido.;https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=400&q=80;299.00;128GB;Unico;;UE;Tecnologia
Cuffie Wireless;Klang;Cuffie stereo senza fili con ricarica rapida.;https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80;49.00;Standard;Unico;;UE;Tecnologia
Smartwatch Fitness;FitLife;Orologio con cardiofrequenzimetro e tracciamento GPS.;https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?auto=format&fit=crop&w=400&q=80;89.00;Unica;Unico;;UE;Elettronica
Tastiera Meccanica;KeyClick;Tastiera retroilluminata RGB con switch rossi lineari.;https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=400&q=80;69.99;Standard;Standard;;UE;Tecnologia
Monitor Gaming;VisionX;Monitor da 27 pollici 144Hz ideale per il gaming.;https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=400&q=80;199.50;27 pollici;Standard;;UE;Tecnologia`;

        let prodotti = [];
        let carrello = JSON.parse(localStorage.getItem("carrello")) || [];

        window.onload = function() {
            prodotti = parseCSV(prodottiCSV);
            aggiornaGrigliaProdotti();
            aggiornaBadgeCarrello();
        };
        function parseCSV(text) {
            let linee = text.trim().split("\n");
            let intestazioni = linee[0].split(";").map(header => header.trim());
            let risultato = [];

            for (let i = 1; i < linee.length; i++) {
                if (!linee[i].trim()) continue;
                
                let valoriCorrenti = linee[i].split(";");
                let oggettoProdotto = {};

                intestazioni.forEach((intestazione, indice) => {
                    let valore = valoriCorrenti[indice] ? valoriCorrenti[indice].trim() : "";
                    
                    if (intestazione === "prezzo") {
                        valore = parseFloat(valore) || 0;
                    }
                    
                    oggettoProdotto[intestazione] = valore;
                });

                risultato.push(oggettoProdotto);
            }
            return risultato;
        }

        function avviso(messaggio) {
            let notifica = document.getElementById('notifica');
            let testo = document.getElementById('testo-notifica');
            texto.innerText = messaggio;
            notifica.classList.remove('hidden');
            setTimeout(() => { notifica.classList.add('hidden'); }, 2000);
        }

        function aggiornaBadgeCarrello() {
            let qtaTotale = carrello.reduce((acc, item) => acc + item.quantita, 0);
            document.getElementById('num-carrello').innerText = qtaTotale;
        }

        let schemaBoxProdotto = {
            tag: 'div',
            classi: 'product-card',
            figli: [
                { tag: 'img', classi: 'product-img', chiaveSorgente: 'immagine' },
                { tag: 'h3', classi: 'product-title', chiaveTesto: 'nome' },
                {
                    tag: 'div',
                    classi: 'product-footer',
                    figli: [
                        { tag: 'span', classi: 'product-price', chiaveTesto: 'prezzo' },
                        { tag: 'button', classi: 'btn-add', testofisso: 'Aggiungi' }
                    ]
                }
            ]
        };

        function creaElementoRicorsivo(nodo, datiProdotto, indiceProdotto) {
            let el = document.createElement(nodo.tag);
            if (nodo.classi) el.className = nodo.classi;
            
            if (nodo.tag === 'img' && nodo.chiaveSorgente) {
                el.src = datiProdotto[nodo.chiaveSorgente];
                el.alt = datiProdotto.nome;
            }
            if (nodo.chiaveTesto) {
                let valore = datiProdotto[nodo.chiaveTesto];
                if (nodo.tag === 'span' && nodo.classi && nodo.classi.includes('product-price')) {
                    valore = parseFloat(valore).toFixed(2) + " €";
                }
                el.innerText = (nodo.prefisso || '') + valore;
            }
            if (nodo.testofisso) {
                el.innerText = nodo.testofisso;
                el.onclick = function() { aggiungiAlCarrello(indiceProdotto); };
            }

            if (nodo.figli && Array.isArray(nodo.figli)) {
                nodo.figli.forEach(figlio => {
                    el.appendChild(creaElementoRicorsivo(figlio, datiProdotto, indiceProdotto));
                });
            }
            return el;
        }

        function aggiornaGrigliaProdotti() {
            let contenitore = document.getElementById('lista-prodotti');
            if (!contenitore) return;
            contenitore.innerHTML = '';
            prodotti.forEach((p, i) => {
                contenitore.appendChild(creaElementoRicorsivo(schemaBoxProdotto, p, i));
            });
        }

        function aggiungiAlCarrello(indice) {
            let prod = prodotti[indice];
            let trovato = carrello.find(item => item.prodotto.nome === prod.nome);
            if (trovato) {
                trovato.quantita += 1;
            } else {
                carrello.push({ prodotto: prod, quantita: 1 });
            }
            localStorage.setItem("carrello", JSON.stringify(carrello));
            aggiornaBadgeCarrello();
            avviso("Aggiunto al carrello!");
        }
    </script>
</body>
</html>
