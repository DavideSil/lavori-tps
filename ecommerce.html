<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --p: #2c3e50; --a: #3498db; --bg: #f4f7f6; --w: #ffffff; --r: #e74c3c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #333; }
        header { background: var(--p); color: var(--w); padding: 1rem; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav-c { max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        nav a { color: var(--w); text-decoration: none; margin-left: 15px; cursor: pointer; font-weight: 500; }
        section { display: none; padding: 40px 20px; max-width: 1200px; margin: auto; }
        section.active { display: block; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { 
            background: var(--w); border-radius: 10px; padding: 15px; width: 280px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .card .price { font-size: 1.2rem; font-weight: bold; color: var(--r); margin: 10px 0; }
        .card button { background: var(--a); color: var(--w); border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; }
        .form-box { background: var(--w); padding: 25px; border-radius: 10px; max-width: 450px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-box h2 { margin-bottom: 20px; color: var(--p); text-align: center; }
        .form-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .form-box button { background: var(--p); color: var(--w); border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; }
        #msg { color: var(--r); font-size: 0.9rem; margin-bottom: 10px; text-align: center; min-height: 1.2rem; }
        .cart-table { width: 100%; border-collapse: collapse; background: var(--w); margin-top: 20px; }
        .cart-table th, .cart-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .total-area { text-align: right; padding: 20px; font-size: 1.5rem; font-weight: bold; }
        .btn-pdf { background: #27ae60; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; }
        @media (max-width: 600px) { .nav-c { flex-direction: column; gap: 10px; } .card { width: 100%; } }
    </style>
</head>
<body>

<header>
    <div class="nav-c">
        <h1 onclick="view('home')" style="cursor:pointer">ShopX</h1>
        <nav>
            <a onclick="view('home')">Negozio</a>
            <a onclick="view('reg')">Registrati</a>
            <a onclick="view('login')">Login</a>
            <a onclick="view('cart')">Carrello (<span id="count">0</span>)</a>
        </nav>
    </div>
</header>

<section id="home" class="active">
    <div id="box-prodotti" class="grid"></div>
</section>

<section id="reg">
    <div class="form-box">
        <h2>Registrazione</h2>
        <p id="msg"></p>
        <input type="text" id="nome" placeholder="Nome">
        <input type="text" id="cognome" placeholder="Cognome">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <input type="text" id="indirizzo" placeholder="Indirizzo">
        <input type="text" id="cap" placeholder="CAP">
        <button onclick="validaESalva()">Crea Account</button>
    </div>
</section>

<section id="login">
    <div class="form-box">
        <h2>Login</h2>
        <input type="email" id="l-email" placeholder="Email">
        <input type="password" id="l-pass" placeholder="Password">
        <button onclick="login()">Accedi</button>
    </div>
</section>

<section id="cart">
    <div id="receipt" style="padding: 30px; background: white;">
        <h2 style="border-bottom: 2px solid #333; padding-bottom: 10px;">Scontrino Fiscale</h2>
        <div id="user-info" style="margin: 15px 0; line-height: 1.6;"></div>
        <table class="cart-table">
            <thead><tr><th>Descrizione</th><th>Prezzo</th></tr></thead>
            <tbody id="cart-list"></tbody>
        </table>
        <div class="total-area">TOTALE: € <span id="total">0.00</span></div>
    </div>
    <div style="text-align:center; margin-top:20px;">
        <button class="btn-pdf" onclick="stampa()">Paga e Scarica Scontrino (PDF)</button>
    </div>
</section>

<script>
    const db = [
        { id: 1, n: "Laptop Pro", m: "TechLife", p: 1200.00, i: "https://picsum.photos/id/0/300/200" },
        { id: 2, n: "Smartphone Z", m: "MobileGo", p: 650.50, i: "https://picsum.photos/id/1/300/200" },
        { id: 3, n: "Cuffie Noise Cancel", m: "SoundMaster", p: 199.00, i: "https://picsum.photos/id/2/300/200" },
        { id: 4, n: "Smartwatch", m: "WristIT", p: 150.00, i: "https://picsum.photos/id/3/300/200" }
    ];

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let currentUser = JSON.parse(localStorage.getItem('session')) || null;

    function view(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'cart') renderCart();
    }

    function renderProducts(arr, i, target) {
        if (i >= arr.length) return;
        const item = arr[i];
        const d = document.createElement('div');
        d.className = 'card';
        d.innerHTML = `
            <img src="${item.i}">
            <h3>${item.n}</h3>
            <p><small>${item.m}</small></p>
            <div class="price">€ ${item.p.toFixed(2)}</div>
            <button onclick="add(${item.id})">Aggiungi al carrello</button>
        `;
        target.appendChild(d);
        renderProducts(arr, i + 1, target);
    }

    function add(id) {
        cart.push(db.find(x => x.id === id));
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCount();
    }

    function updateCount() {
        document.getElementById('count').innerText = cart.length;
    }

    function validaESalva() {
        const m = document.getElementById("msg");
        const n = document.getElementById("nome").value;
        const c = document.getElementById("cognome").value;
        const e = document.getElementById("email").value;
        const p = document.getElementById("pass").value;
        const ind = document.getElementById("indirizzo").value;
        const cap = document.getElementById("cap").value;

        const regT = /^[a-zA-ZàèéìòùÀÈÉÌÒÙ ]+$/;
        const regE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        const regC = /^\d{5}$/;

        if (!regT.test(n)) return m.innerText = "Nome non valido";
        if (!regT.test(c)) return m.innerText = "Cognome non valido";
        if (!regE.test(e)) return m.innerText = "Email non valida";
        if (p.length < 6) return m.innerText = "Password: minimo 6 caratteri";
        if (ind.length < 5) return m.innerText = "Indirizzo non valido";
        if (!regC.test(cap)) return m.innerText = "CAP non valido (5 cifre)";

        let u = { nome: n, cognome: c, email: e, pass: p, indirizzo: ind, cap: cap };
        let users = JSON.parse(localStorage.getItem('users')) || [];
        users.push(u);
        localStorage.setItem('users', JSON.stringify(users));
        alert("Registrazione completata!");
        view('login');
    }

    function login() {
        const e = document.getElementById('l-email').value;
        const p = document.getElementById('l-pass').value;
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let u = users.find(x => x.email === e && x.pass === p);
        if(u) {
            currentUser = u;
            localStorage.setItem('session', JSON.stringify(u));
            alert("Bentornato " + u.nome);
            view('home');
        } else alert("Credenziali errate");
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const info = document.getElementById('user-info');
        list.innerHTML = '';
        let tot = 0;
        cart.forEach(x => {
            list.innerHTML += `<tr><td>${x.n}</td><td>€ ${x.p.toFixed(2)}</td></tr>`;
            tot += x.p;
        });
        document.getElementById('total').innerText = tot.toFixed(2);
        
        if (currentUser) {
            info.innerHTML = `
                <strong>Cliente:</strong> ${currentUser.nome.toUpperCase()} ${currentUser.cognome.toUpperCase()}<br>
                <strong>Spedizione:</strong> ${currentUser.indirizzo.toUpperCase()}, ${currentUser.cap}
            `;
        } else {
            info.innerHTML = "<strong>Cliente:</strong> Ospite";
        }
    }

    function stampa() {
        if(cart.length === 0) return alert("Carrello vuoto");
        const element = document.getElementById('receipt');
        const opt = { margin: 1, filename: 'scontrino.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
        html2pdf().set(opt).from(element).save().then(() => {
            cart = [];
            localStorage.removeItem('cart');
            updateCount();
            view('home');
        });
    }

    window.onload = () => {
        renderProducts(db, 0, document.getElementById('box-prodotti'));
        updateCount();
    };
</script>

</body>
</html>
